<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | 홍길동의 블로그</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html" aria-label="홈으로 이동">홍길동의 블로그</a>
        <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="site-nav" aria-label="주요 메뉴">
          <a href="index.html">홈</a>
          <a class="auth-only" href="write.html">글쓰기</a>
          <a class="auth-only" href="profile.html">프로필</a>
          <a class="guest-only active" href="login.html">로그인</a>
          <a class="guest-only" href="signup.html">회원가입</a>
          <button type="button" class="nav-logout auth-only" data-logout>로그아웃</button>
        </nav>
      </div>
    </header>

    <main>
      <section class="section page-hero">
        <div class="container page-panel">
          <p class="section-label">Login</p>
          <h1>다시 만나서 반가워요.</h1>
          <p>아이디와 비밀번호를 입력해 로그인해주세요.</p>
        </div>
      </section>

      <section class="section muted">
        <div class="container">
          <form id="loginForm" class="form-card" novalidate>
            <div class="form-group">
              <label for="username">아이디</label>
              <input type="text" id="username" name="username" autocomplete="username" required />
            </div>
            <div class="form-group">
              <label for="password">비밀번호</label>
              <input type="password" id="password" name="password" autocomplete="current-password" required />
            </div>
            <p id="loginMessage" class="form-message" role="status"></p>
            <div class="form-actions">
              <button type="submit" class="button primary">로그인</button>
            </div>
            <p class="form-footnote">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 홍길동. All rights reserved.</p>
      </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
