<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>홍길동의 블로그</title>
    <link rel="stylesheet" href="css/style.css" />

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html" aria-label="홈으로 이동">홍길동의 블로그</a>
        <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="site-nav" aria-label="주요 메뉴">
          <a class="active" href="index.html">홈</a>
          <a class="auth-only" href="write.html">글쓰기</a>
          <a class="auth-only" href="profile.html">프로필</a>

    <main>

            <p>최신 게시글부터 순서대로 보여줍니다.</p>
          </div>
          <div id="postList" class="post-list" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
