<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>프로필 | 홍길동의 블로그</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html" aria-label="홈으로 이동">홍길동의 블로그</a>
        <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="site-nav" aria-label="주요 메뉴">
          <a href="index.html">홈</a>
          <a class="auth-only" href="write.html">글쓰기</a>
          <a class="auth-only active" href="profile.html">프로필</a>
          <a class="guest-only" href="login.html">로그인</a>
          <a class="guest-only" href="signup.html">회원가입</a>
          <button type="button" class="nav-logout auth-only" data-logout>로그아웃</button>
        </nav>
      </div>
    </header>

    <main>
      <div id="profileGuard" class="section profile-guard" hidden>
        <div class="container">
          <p>프로필을 보려면 로그인이 필요합니다.</p>
          <a class="button primary" href="login.html">로그인하러 가기</a>
        </div>
      </div>

      <div id="profileContent" hidden>
        <section class="section page-hero">
          <div class="container narrow">
            <div class="page-panel profile-page-card">
              <img class="profile-image" src="assets/images/profile.jpeg" alt="프로필 사진" />
              <h1 id="profileName"></h1>
              <p id="profileUsername" class="section-label"></p>
              <ul class="profile-meta">
                <li id="profileEmail"></li>
                <li id="profileJoined"></li>
              </ul>
            </div>
          </div>
        </section>

        <section class="section muted">
          <div class="container">
            <div class="section-heading">
              <div>
                <p class="section-label">My Posts</p>
                <h2>내가 작성한 게시글</h2>
              </div>
              <a class="button secondary" href="write.html">새 글 작성</a>
            </div>
            <div id="myPostList" class="post-list"></div>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 홍길동. All rights reserved.</p>
      </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
