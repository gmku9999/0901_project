<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>글쓰기 | 홍길동의 블로그</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html" aria-label="홈으로 이동">홍길동의 블로그</a>
        <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="site-nav" aria-label="주요 메뉴">
          <a href="index.html">홈</a>
          <a class="auth-only active" href="write.html">글쓰기</a>
          <a class="auth-only" href="profile.html">프로필</a>
          <a class="guest-only" href="login.html">로그인</a>
          <a class="guest-only" href="signup.html">회원가입</a>
          <button type="button" class="nav-logout auth-only" data-logout>로그아웃</button>
        </nav>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <form id="postForm" class="form-card wide" novalidate>
            <h1 id="writeHeading">게시글 작성</h1>
            <div class="form-group">
              <label for="title">제목</label>
              <input type="text" id="title" name="title" required />
              <p id="titleError" class="form-error"></p>
            </div>
            <div class="form-group">
              <label for="content">내용</label>
              <textarea id="content" name="content" required></textarea>
              <p id="contentError" class="form-error"></p>
            </div>
            <div class="form-actions">
              <button type="submit" class="button primary">저장하기</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 홍길동. All rights reserved.</p>
      </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/post-write.js"></script>
  </body>
</html>
